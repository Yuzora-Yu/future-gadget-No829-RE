name: Daily 176248 Signal Collection

on:
  schedule:
    # 00:30 UTC = 09:30 JST. GitHub schedules can start a little late.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-176248-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify fixed protocol
        run: python test_protocol.py

      - name: Collect public signal packet
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collector.py

      - name: Commit immutable daily result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json protocol.json
          git diff --staged --quiet && exit 0
          git commit -m "signal: lock $(TZ=Asia/Tokyo date +%Y-%m-%d) JST"
          git push
