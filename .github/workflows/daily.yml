name: Daily Signal Collection

on:
  schedule:
    # Two automatic windows in JST. The collector keeps one best record per day.
    - cron: '37 0 * * *'  # 09:37 JST
    - cron: '7 2 * * *'   # 11:07 JST fallback
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'collector.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: '異常検知メールのテスト送信を行う'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-signal-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.SMTP_USERNAME }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      PAGES_URL: ${{ vars.PAGES_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify fixed protocol
        run: python test_protocol.py

      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: python -c "import sys, collector; sys.exit(0 if collector.send_test_email() else 1)"

      - name: Collect public signal packet with automatic retry
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          set +e
          final_code=2
          for attempt in 1 2 3; do
            echo "collection attempt ${attempt}/3"
            python collector.py
            final_code=$?
            if [ "$final_code" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 45))
            fi
          done
          # A degraded observation is still committed and retried by the fallback schedule.
          exit 0

      - name: Commit best daily result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/notification-state.json protocol.json
          git diff --staged --quiet && exit 0
          git commit -m "signal: lock $(TZ=Asia/Tokyo date +%Y-%m-%d) JST"
          git pull --rebase
          git push
